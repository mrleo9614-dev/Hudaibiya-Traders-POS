
name: Build Hudaibiya Traders APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q Hudaibiya_Traders_Mobile_Cloud_Build.zip -d source

      - name: Build APK
        working-directory: source/HudaibiyaTradersAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Hudaibiya-Traders-test-APK
          path: source/HudaibiyaTradersAndroid/app/build/outputs/apk/debug/app-debug.apk
